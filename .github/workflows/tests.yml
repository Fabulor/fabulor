name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_validation:
    name: Build validation
    runs-on: windows-2022

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
          architecture: x64

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install native build prerequisites
        run: |
          New-Item -Name "deps" -ItemType "Directory" -Force | Out-Null

          python -m pip install --upgrade pip
          python -m pip install cffi

          $ProgressPreference = 'SilentlyContinue'
          function Download-WithRetry {
            param(
              [string]$Url,
              [string]$OutFile,
              [int]$MaxAttempts = 5,
              [int]$InitialDelaySeconds = 2
            )
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                Invoke-WebRequest -Uri $Url -OutFile $OutFile -ErrorAction Stop
                return
              }
              catch {
                if ($attempt -eq $MaxAttempts) {
                  throw
                }
                Start-Sleep -Seconds ($InitialDelaySeconds * [math]::Pow(2, $attempt - 1))
              }
            }
          }

          $gtk4Contract = Get-Content tools\gtk4\dependency-contract.json -Raw | ConvertFrom-Json
          $gtk4Archive = Join-Path 'deps' $gtk4Contract.source.file_name
          Download-WithRetry -Url $gtk4Contract.source.url -OutFile $gtk4Archive
          python tools\gtk4\validate_root.py --archive $gtk4Archive
          $repoGtk4Root = Join-Path $env:GITHUB_WORKSPACE 'Runtime\GTK4'
          New-Item -Path $repoGtk4Root -ItemType Directory -Force | Out-Null
          Expand-Archive -LiteralPath $gtk4Archive -DestinationPath $repoGtk4Root -Force
          python tools\gtk4\validate_root.py --root $repoGtk4Root

          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) {
            $vcpkg = 'C:\vcpkg\vcpkg.exe'
          }
          if (-not (Test-Path $vcpkg)) { throw "Unable to locate vcpkg.exe." }
          $supportInstallRoot = Join-Path $env:GITHUB_WORKSPACE 'build\vcpkg-installed'
          & $vcpkg install --triplet x64-windows --x-manifest-root="$env:GITHUB_WORKSPACE\tools\windows-deps" --x-install-root="$supportInstallRoot"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE." }
          $supportRoot = Join-Path $supportInstallRoot 'x64-windows'
          "FABULOR_SUPPORT_DEPS_ROOT=$supportRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Download-WithRetry -Url https://github.com/ZoiteChat/gvsbuild/releases/download/zoitechat-2.18.0-pre4/WinSparkle-20260315.7z -OutFile deps\WinSparkle.7z
          & 7z.exe x deps\WinSparkle.7z -oC:\gtk-build\WinSparkle

          Download-WithRetry -Url https://sourceforge.net/projects/magicsplat/files/magicsplat-tcl/tcl-8.6.16-installer-1.16.0-x64.msi/download -OutFile deps\tcltk-sourceforge.html
          $tclMsiMatch = [regex]::Match((Get-Content -Raw deps\tcltk-sourceforge.html), 'https://downloads\.sourceforge\.net/project/magicsplat/magicsplat-tcl/tcl-8\.6\.16-installer-1\.16\.0-x64\.msi\?[^"\s<>]*use_mirror=[^"\s<>]*')
          if (-not $tclMsiMatch.Success) {
            throw "Unable to resolve the direct Magicsplat Tcl/Tk MSI download URL from SourceForge."
          }
          Download-WithRetry -Url $tclMsiMatch.Value.Replace('&amp;', '&') -OutFile deps\tcltk-x64.msi
          $tclExtractRoot = Join-Path $env:RUNNER_TEMP 'tcl-runtime'
          if (Test-Path $tclExtractRoot) {
            Remove-Item $tclExtractRoot -Recurse -Force
          }
          New-Item -Path $tclExtractRoot -ItemType Directory -Force | Out-Null
          & $env:ComSpec /c ('msiexec /a "{0}" /qn TARGETDIR="{1}"' -f (Resolve-Path deps\tcltk-x64.msi), $tclExtractRoot)
          if ($LASTEXITCODE -ne 0) {
            throw "Magicsplat Tcl/Tk MSI extraction failed with exit code $LASTEXITCODE."
          }

          $tclRuntime = Get-ChildItem -Path $tclExtractRoot -Filter tcl86t.dll -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $tclRuntime) {
            throw "Unable to locate tcl86t.dll under the extracted Tcl payload at $tclExtractRoot."
          }

          $tclRoot = Split-Path (Split-Path $tclRuntime.FullName -Parent) -Parent
          $repoTclRoot = Join-Path $env:GITHUB_WORKSPACE 'Runtime\Tcl'
          if (Test-Path $repoTclRoot) {
            Remove-Item $repoTclRoot -Recurse -Force
          }
          New-Item -Path $repoTclRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path (Join-Path $tclRoot 'bin') -Destination (Join-Path $repoTclRoot 'bin') -Recurse -Force
          Copy-Item -Path (Join-Path $tclRoot 'include') -Destination (Join-Path $repoTclRoot 'include') -Recurse -Force
          Copy-Item -Path (Join-Path $tclRoot 'lib') -Destination (Join-Path $repoTclRoot 'lib') -Recurse -Force

          $pyRoot = $env:pythonLocation
          if (-not $pyRoot) { $pyRoot = & python -c "import sys; print(sys.prefix)" }

          foreach ($pyDir in @("C:\gtk-build\python-3.14.3", "C:\gtk-build\python-3.14")) {
            New-Item -Path $pyDir -ItemType Directory -Force | Out-Null
            $target = Join-Path $pyDir "x64"
            if (Test-Path $target) { Remove-Item $target -Recurse -Force }
            New-Item -Path $pyDir -Name "x64" -ItemType Junction -Value $pyRoot | Out-Null
          }

      - name: Build native and managed validation targets
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"

          set "PYTHON_DIR=C:\gtk-build\python-3.14.3\x64"
          if not exist "%PYTHON_DIR%\libs\python314.lib" (
            echo Missing %PYTHON_DIR%\libs\python314.lib
            dir "%PYTHON_DIR%\libs"
            exit /b 1
          )

          set "LIB=%PYTHON_DIR%\libs;%LIB%"
          set "INCLUDE=%PYTHON_DIR%\include;%INCLUDE%"

          rem Build the supported GTK4 solution entry point so generated files
          rem such as config.h are created in the expected solution context.
          msbuild win32\zoitechat.sln /m /verbosity:minimal /p:Configuration=Release /p:Platform=x64 /p:FabulorGtk4Root="%GITHUB_WORKSPACE%\Runtime\GTK4" /p:FabulorSupportDepsRoot="%FABULOR_SUPPORT_DEPS_ROOT%"
          if errorlevel 1 exit /b 1

          dotnet build src\managed\Fabulor.PluginHost\Fabulor.PluginHost.csproj -c Release
          if errorlevel 1 exit /b 1

          dotnet build samples\plugins\example.csharp.greeter\GreeterPlugin.csproj -c Release
        shell: cmd
