name: Windows Installer Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  windows_build:
    runs-on: windows-2022

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    strategy:
      matrix:
        platform: [x64]
        arch: [x64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
          architecture: ${{ matrix.arch }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x
            8.0.423

      - name: Install WiX payload prerequisites
        run: |
          New-Item -Name "deps" -ItemType "Directory" -Force | Out-Null

          python -m pip install --upgrade pip
          python -m pip install cffi==2.1.0
          python -m pip install meson==1.11.2 ninja==1.13.0

          $ProgressPreference = 'SilentlyContinue'
          function Download-WithRetry {
            param(
              [string]$Url,
              [string]$OutFile,
              [int]$MaxAttempts = 5,
              [int]$InitialDelaySeconds = 2
            )
            for ($attempt = 1; $attempt -le $MaxAttempts; $attempt++) {
              try {
                Invoke-WebRequest -Uri $Url -OutFile $OutFile -ErrorAction Stop
                return
              }
              catch {
                if ($attempt -eq $MaxAttempts) {
                  throw
                }
                Start-Sleep -Seconds ($InitialDelaySeconds * [math]::Pow(2, $attempt - 1))
              }
            }
          }

          $gtk4Contract = Get-Content tools\gtk4\dependency-contract.json -Raw | ConvertFrom-Json
          $gtk4Archive = Join-Path 'deps' $gtk4Contract.source.file_name
          Download-WithRetry -Url $gtk4Contract.source.url -OutFile $gtk4Archive
          python tools\gtk4\validate_root.py --archive $gtk4Archive
          $repoGtk4Root = Join-Path $env:GITHUB_WORKSPACE 'Runtime\GTK4'
          if (Test-Path $repoGtk4Root) { Remove-Item $repoGtk4Root -Recurse -Force }
          New-Item -Path $repoGtk4Root -ItemType Directory -Force | Out-Null
          Expand-Archive -LiteralPath $gtk4Archive -DestinationPath $repoGtk4Root -Force
          python tools\gtk4\validate_root.py --root $repoGtk4Root

          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) {
            $vcpkg = 'C:\vcpkg\vcpkg.exe'
          }
          if (-not (Test-Path $vcpkg)) { throw "Unable to locate vcpkg.exe." }
          $supportInstallRoot = Join-Path $env:GITHUB_WORKSPACE 'build\vcpkg-installed'
          & $vcpkg install --triplet x64-windows --x-manifest-root="$env:GITHUB_WORKSPACE\tools\windows-deps" --x-install-root="$supportInstallRoot"
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed with exit code $LASTEXITCODE." }
          $supportRoot = Join-Path $supportInstallRoot 'x64-windows'
          $supportBin = Join-Path $supportRoot 'bin'
          New-Item -Path $supportBin -ItemType Directory -Force | Out-Null
          $certPath = Join-Path $supportBin 'cert.pem'
          Download-WithRetry -Url https://curl.se/ca/cacert-2026-07-16.pem -OutFile $certPath
          $cert = Get-Item $certPath
          $certHash = (Get-FileHash -Algorithm SHA256 $certPath).Hash
          if ($cert.Length -ne 186446 -or $certHash -ne '3FF344E30B9B1ED2971044EABB438A08F2E2245DDB5F8AB1A3AD8B63AB4EAF91') {
            throw "CA bundle integrity check failed: size=$($cert.Length), SHA256=$certHash"
          }
          "FABULOR_SUPPORT_DEPS_ROOT=$supportRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Download-WithRetry -Url https://sourceforge.net/projects/magicsplat/files/magicsplat-tcl/tcl-8.6.16-installer-1.16.0-x64.msi/download -OutFile deps\tcltk-sourceforge.html
          $tclMsiMatch = [regex]::Match((Get-Content -Raw deps\tcltk-sourceforge.html), 'https://downloads\.sourceforge\.net/project/magicsplat/magicsplat-tcl/tcl-8\.6\.16-installer-1\.16\.0-x64\.msi\?[^"\s<>]*use_mirror=[^"\s<>]*')
          if (-not $tclMsiMatch.Success) {
            throw "Unable to resolve the direct Magicsplat Tcl/Tk MSI download URL from SourceForge."
          }
          Download-WithRetry -Url $tclMsiMatch.Value.Replace('&amp;', '&') -OutFile deps\tcltk-x64.msi
          $tclMsiHash = (Get-FileHash -Algorithm SHA256 deps\tcltk-x64.msi).Hash.ToLowerInvariant()
          if ($tclMsiHash -ne '754a5fc471fdae655dd0cec1fd5613b2302512adadcde28e17b516b0f5aed17a') {
            throw "Tcl 8.6.16 MSI hash mismatch: $tclMsiHash"
          }
          $tclExtractRoot = Join-Path $env:RUNNER_TEMP 'tcl-runtime'
          if (Test-Path $tclExtractRoot) {
            Remove-Item $tclExtractRoot -Recurse -Force
          }
          New-Item -Path $tclExtractRoot -ItemType Directory -Force | Out-Null
          & $env:ComSpec /c ('msiexec /a "{0}" /qn TARGETDIR="{1}"' -f (Resolve-Path deps\tcltk-x64.msi), $tclExtractRoot)
          if ($LASTEXITCODE -ne 0) {
            throw "Magicsplat Tcl/Tk MSI extraction failed with exit code $LASTEXITCODE."
          }

          $tclRuntime = Get-ChildItem -Path $tclExtractRoot -Filter tcl86t.dll -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $tclRuntime) {
            throw "Unable to locate tcl86t.dll under the extracted Tcl payload at $tclExtractRoot."
          }

          $tclRoot = Split-Path (Split-Path $tclRuntime.FullName -Parent) -Parent
          $repoTclRoot = Join-Path $env:GITHUB_WORKSPACE 'Runtime\Tcl'
          if (Test-Path $repoTclRoot) {
            Remove-Item $repoTclRoot -Recurse -Force
          }
          New-Item -Path $repoTclRoot -ItemType Directory -Force | Out-Null
          Copy-Item -Path (Join-Path $tclRoot 'bin') -Destination (Join-Path $repoTclRoot 'bin') -Recurse -Force
          Copy-Item -Path (Join-Path $tclRoot 'include') -Destination (Join-Path $repoTclRoot 'include') -Recurse -Force
          Copy-Item -Path (Join-Path $tclRoot 'lib') -Destination (Join-Path $repoTclRoot 'lib') -Recurse -Force

          $pyRoot = $env:pythonLocation
          if (-not $pyRoot) { $pyRoot = & python -c "import sys; print(sys.prefix)" }

          foreach ($pyDir in @("C:\gtk-build\python-3.14.3", "C:\gtk-build\python-3.14")) {
            New-Item -Path $pyDir -ItemType Directory -Force | Out-Null
            $target = Join-Path $pyDir "${{ matrix.platform }}"
            if (Test-Path $target) { Remove-Item $target -Recurse -Force }
            New-Item -Path $pyDir -Name "${{ matrix.platform }}" -ItemType Junction -Value $pyRoot | Out-Null
          }

          $repoPy314Root = Join-Path $env:GITHUB_WORKSPACE 'Runtime\Python314'
          if (Test-Path $repoPy314Root) { Remove-Item $repoPy314Root -Recurse -Force }
          $pythonEmbed = Join-Path $env:GITHUB_WORKSPACE 'deps\python-3.14.3-embed-amd64.zip'
          Download-WithRetry -Url https://www.python.org/ftp/python/3.14.3/python-3.14.3-embed-amd64.zip -OutFile $pythonEmbed
          $pythonEmbedHash = (Get-FileHash -Algorithm SHA256 $pythonEmbed).Hash.ToLowerInvariant()
          if ($pythonEmbedHash -ne 'ad4961a479dedbeb7c7d113253f8db1b1935586b73c27488712beec4f2c894e6') {
            throw "Python 3.14.3 embeddable package hash mismatch: $pythonEmbedHash"
          }
          New-Item -ItemType Directory -Path $repoPy314Root -Force | Out-Null
          Expand-Archive -LiteralPath $pythonEmbed -DestinationPath $repoPy314Root -Force

      - name: Build WiX payload and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.arch }} -host_arch=x64

          python tools\gtk4\test_validate_root.py
          if errorlevel 1 exit /b 1

          python tools\gtk4\test_stage_runtime.py
          if errorlevel 1 exit /b 1

          set "GTK4_RUNTIME_ROOT=%GITHUB_WORKSPACE%\build\gtk4-runtime-production-root"
          python tools\gtk4\stage_runtime.py --root "%GITHUB_WORKSPACE%\Runtime\GTK4" --output "%GTK4_RUNTIME_ROOT%\Runtime\GTK4"
          if errorlevel 1 exit /b 1

          python tools\gtk4\validate_runtime_imports.py --root "%GTK4_RUNTIME_ROOT%\Runtime\GTK4" --dumpbin dumpbin
          if errorlevel 1 exit /b 1

          msbuild tools\gtk4\runtime-root-probe.vcxproj /m /verbosity:minimal /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:FabulorGtk4StartupRoot="%GTK4_RUNTIME_ROOT%"
          if errorlevel 1 exit /b 1

          python tools\gtk4\test_runtime_root_probe.py --candidate-root "%GTK4_RUNTIME_ROOT%"
          if errorlevel 1 exit /b 1

          msbuild tools\gtk4\gtk4-probe.vcxproj /m /verbosity:minimal /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:FabulorGtk4Root="%GITHUB_WORKSPACE%\Runtime\GTK4"
          if errorlevel 1 exit /b 1

          msbuild tools\gtk4\gtk4-full-frontend.proj /t:Build /m:1 /verbosity:minimal /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:FabulorGtk4Root="%GITHUB_WORKSPACE%\Runtime\GTK4" /p:FabulorSupportDepsRoot="%FABULOR_SUPPORT_DEPS_ROOT%"
          if errorlevel 1 exit /b 1

          python tools\gtk4\validate_frontend_bootstrap.py --launcher "%GITHUB_WORKSPACE%\build\gtk4-full\x64\rel\fabulor.exe" --frontend "%GITHUB_WORKSPACE%\build\gtk4-full\x64\rel\fabulor-gtk4-frontend.dll" --runtime-root "%GTK4_RUNTIME_ROOT%\Runtime\GTK4" --dumpbin dumpbin
          if errorlevel 1 exit /b 1

          msbuild tools\gtk4\gtk4-native-extensions.proj /t:Build /m:1 /verbosity:minimal /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:FabulorGtk4Root="%GITHUB_WORKSPACE%\Runtime\GTK4" /p:FabulorSupportDepsRoot="%FABULOR_SUPPORT_DEPS_ROOT%"
          if errorlevel 1 exit /b 1

          python -m mesonbuild.mesonmain setup --buildtype=release build\gtk4-probe-meson tools\gtk4 "-Dgtk4_root=%GITHUB_WORKSPACE%\Runtime\GTK4"
          if errorlevel 1 exit /b 1
          python -m mesonbuild.mesonmain compile -C build\gtk4-probe-meson
          if errorlevel 1 exit /b 1
          python -m mesonbuild.mesonmain test -C build\gtk4-probe-meson --print-errorlogs
          if errorlevel 1 exit /b 1

          set "PYTHON_DIR=C:\gtk-build\python-3.14.3\${{ matrix.platform }}"
          if not exist "%PYTHON_DIR%\libs\python314.lib" (
            echo Missing %PYTHON_DIR%\libs\python314.lib
            dir "%PYTHON_DIR%\libs"
            exit /b 1
          )

          set "LIB=%PYTHON_DIR%\libs;%LIB%"
          set "INCLUDE=%PYTHON_DIR%\include;%INCLUDE%"

          set "ENCHANT_WORK=%RUNNER_TEMP%\fabulor-enchant-msvc"
          if not exist "%ENCHANT_WORK%" mkdir "%ENCHANT_WORK%"
          gh release download v2.8.19 --repo rrthomas/enchant --pattern enchant-2.8.19.tar.gz --dir "%ENCHANT_WORK%" --clobber
          if errorlevel 1 exit /b 1
          for /f %%H in ('powershell -NoProfile -Command "(Get-FileHash -Algorithm SHA256 ''%ENCHANT_WORK%\enchant-2.8.19.tar.gz'').Hash.ToLowerInvariant()"') do set "ENCHANT_HASH=%%H"
          if not "%ENCHANT_HASH%"=="c8d70991d544ee39274b96bd01d2858a009fe732ff43f2aaf605fd61ecd06f60" (
            echo Enchant 2.8.19 source hash mismatch: %ENCHANT_HASH%
            exit /b 1
          )

          rem Configure the verified Enchant source against the production GTK4 GLib.
          set "GTK4_ENCHANT_ROOT=%GITHUB_WORKSPACE%\build\gtk4-enchant-stage"
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\build-enchant-msvc.ps1 -GtkRoot "%GITHUB_WORKSPACE%\Runtime\GTK4" -StageRoot "%GTK4_ENCHANT_ROOT%" -WorkRoot "%ENCHANT_WORK%"
          if errorlevel 1 exit /b 1

          set "FABULOR_STAGE=%GITHUB_WORKSPACE%\build\gtk4-production-support"
          python tools\gtk4\stage_production_support.py --dependency-root "%FABULOR_SUPPORT_DEPS_ROOT%" --python-build-root "%pythonLocation%" --repository-root "%GITHUB_WORKSPACE%" --output "%FABULOR_STAGE%"
          if errorlevel 1 exit /b 1

          python tools\gtk4\validate_native_extensions.py --plugins-root "%GITHUB_WORKSPACE%\build\gtk4-full\x64\rel\plugins" --payload-root "%FABULOR_STAGE%" --enchant-root "%GTK4_ENCHANT_ROOT%" --runtime-root "%GTK4_RUNTIME_ROOT%\Runtime\GTK4" --dumpbin dumpbin
          if errorlevel 1 exit /b 1

          rem Materialize the managed host before WiX evaluates its exact file inputs.
          dotnet build src\managed\Fabulor.PluginHost\Fabulor.PluginHost.csproj -c Release /p:Platform=${{ matrix.platform }} /verbosity:minimal
          if errorlevel 1 exit /b 1

          set "GTK4_PLUGIN_HOST_ROOT=%GITHUB_WORKSPACE%\build\gtk4-plugin-host-production-root"
          python tools\gtk4\stage_plugin_hosts.py --dotnet-root "%ProgramFiles%\dotnet" --managed-root "%GITHUB_WORKSPACE%\src\managed\Fabulor.PluginHost\bin\${{ matrix.platform }}\Release\net8.0" --payload-root "%FABULOR_STAGE%" --python-root "%GITHUB_WORKSPACE%\Runtime\Python314" --tcl-root "%GITHUB_WORKSPACE%\Runtime\Tcl" --output "%GTK4_PLUGIN_HOST_ROOT%"
          if errorlevel 1 exit /b 1

          python tools\release\test_generate_legal_bundle.py
          if errorlevel 1 exit /b 1

          set "FABULOR_LEGAL_ROOT=%GITHUB_WORKSPACE%\build\release-legal"
          python tools\release\generate_legal_bundle.py --output "%FABULOR_LEGAL_ROOT%"
          if errorlevel 1 exit /b 1

          rem Publish the production GTK4 MSI and bootstrapper.
          dotnet build installer\Fabulor.wixproj -c Release /p:Platform=${{ matrix.platform }} /p:GtkRuntimeRoot="%GTK4_RUNTIME_ROOT%\Runtime\GTK4" /p:FabulorPayloadRoot="%FABULOR_STAGE%" /p:Gtk4PluginHostRoot="%GTK4_PLUGIN_HOST_ROOT%" /p:FabulorLegalRoot="%FABULOR_LEGAL_ROOT%" /verbosity:minimal
          if errorlevel 1 exit /b 1

          powershell -NoProfile -ExecutionPolicy Bypass -File tools\release\validate_product_metadata.ps1 -Launcher "%GITHUB_WORKSPACE%\build\gtk4-full\x64\rel\fabulor.exe" -Frontend "%GITHUB_WORKSPACE%\build\gtk4-full\x64\rel\fabulor-gtk4-frontend.dll" -Bootstrapper "%GITHUB_WORKSPACE%\installer\bin\${{ matrix.platform }}\Release\FabulorSetup.exe" -BootstrapperApplication "%GITHUB_WORKSPACE%\installer\UX\bin\${{ matrix.platform }}\Release\net8.0-windows\win-x64\publish\Fabulor.BA.exe" -VersionProps "%GITHUB_WORKSPACE%\installer\Directory.Build.props"
          if errorlevel 1 exit /b 1

          rem Validate production identity, features, absence of GTK3 files, and the
          rem deterministic GTK4 runtime allowlist.
          python tools\gtk4\validate_production_gtk4_msi.py --wix "%USERPROFILE%\.nuget\packages\wixtoolset.sdk\7.0.0\tools\net472\x64\wix.exe" --msi "%GITHUB_WORKSPACE%\installer\bin\${{ matrix.platform }}\Release\Fabulor.msi" --bootstrapper "%GITHUB_WORKSPACE%\installer\bin\${{ matrix.platform }}\Release\FabulorSetup.exe"
          if errorlevel 1 exit /b 1

          python tools\gtk4\validate_runtime_msi.py --wix "%USERPROFILE%\.nuget\packages\wixtoolset.sdk\7.0.0\tools\net472\x64\wix.exe" --msi "%GITHUB_WORKSPACE%\installer\bin\${{ matrix.platform }}\Release\Fabulor.msi" --manifest "%GTK4_RUNTIME_ROOT%\Runtime\GTK4\runtime-manifest.json"
          if errorlevel 1 exit /b 1

          rem Validate bootstrapper identity, chain metadata, exact BA payload,
          rem and byte-for-byte equality with the separately published MSI.
          python tools\gtk4\validate_production_bundle.py --wix "%USERPROFILE%\.nuget\packages\wixtoolset.sdk\7.0.0\tools\net472\x64\wix.exe" --bundle "%GITHUB_WORKSPACE%\installer\bin\${{ matrix.platform }}\Release\FabulorSetup.exe" --msi "%GITHUB_WORKSPACE%\installer\bin\${{ matrix.platform }}\Release\Fabulor.msi" --version-props "%GITHUB_WORKSPACE%\installer\Directory.Build.props"
          if errorlevel 1 exit /b 1
        shell: cmd

      - name: Upload MSI
        id: upload_msi
        uses: actions/upload-artifact@v6
        with:
          name: Fabulor MSI ${{ matrix.arch }}
          path: installer\bin\${{ matrix.platform }}\Release\Fabulor.msi

      - name: Upload Bootstrapper
        id: upload_bootstrapper
        uses: actions/upload-artifact@v6
        with:
          name: Fabulor Bootstrapper ${{ matrix.arch }}
          path: installer\bin\${{ matrix.platform }}\Release\FabulorSetup.exe

      - name: Upload CycloneDX SBOM and third-party notices
        uses: actions/upload-artifact@v6
        with:
          name: Fabulor legal bundle ${{ matrix.arch }}
          path: build\release-legal
