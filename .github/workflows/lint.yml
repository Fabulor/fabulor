name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  repository_lint:
    runs-on: windows-2022

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14.3'
          architecture: x64

      - name: Install validation helpers
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Validate workflow, manifest, and Python files
        run: |
          @'
          import json
          import pathlib
          import py_compile
          import sys
          import unicodedata
          import yaml

          repo = pathlib.Path.cwd()

          workflow_root = repo / ".github" / "workflows"
          workflow_files = sorted(workflow_root.glob("*.yml"))
          if not workflow_files:
              raise SystemExit("No workflow files were found under .github/workflows.")

          for workflow in workflow_files:
              with workflow.open("r", encoding="utf-8") as handle:
                  data = yaml.safe_load(handle)
              if not isinstance(data, dict):
                  raise SystemExit(f"{workflow} did not parse into a mapping.")
              for required_key in ("name", "jobs"):
                  if required_key not in data:
                      raise SystemExit(f"{workflow} is missing the required top-level key '{required_key}'.")
              if "on" not in data and True not in data:
                  raise SystemExit(f"{workflow} is missing the required top-level key 'on'.")

          required_manifest_fields = {
              "id",
              "name",
              "version",
              "language",
              "entrypoint",
              "requires_api_version",
              "dependencies",
              "capabilities",
              "description",
              "author",
              "homepage",
          }

          manifest_string_limits = {
              "id": 128,
              "name": 256,
              "version": 64,
              "language": 16,
              "entrypoint": 1024,
              "description": 2048,
              "author": 256,
              "homepage": 2048,
          }
          manifest_array_limits = {
              "dependencies": (64, 128),
              "capabilities": (32, 64),
          }

          def strict_json_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError(f"Duplicate JSON field '{key}'.")
                  value[key] = item
              return value

          def utf8_length(value):
              return len(value.encode("utf-8"))

          def contains_control(value):
              return any(unicodedata.category(character) == "Cc" for character in value)

          manifest_root = repo / "samples" / "plugins"
          manifests = sorted(manifest_root.glob("*/plugin.json"))
          if not manifests:
              raise SystemExit("No sample plugin manifests were found under samples/plugins.")

          discovered_ids = {}
          parsed_manifests = {}
          for manifest_path in manifests:
              manifest_bytes = manifest_path.read_bytes()
              if not 1 <= len(manifest_bytes) <= 64 * 1024:
                  raise SystemExit(f"{manifest_path} must be between 1 byte and 64 KiB.")
              try:
                  manifest = json.loads(
                      manifest_bytes.decode("utf-8"),
                      object_pairs_hook=strict_json_object,
                  )
              except (UnicodeDecodeError, json.JSONDecodeError, ValueError) as exc:
                  raise SystemExit(f"{manifest_path} is not strict valid JSON: {exc}") from exc
              if type(manifest) is not dict:
                  raise SystemExit(f"{manifest_path} must contain one JSON object.")
              if set(manifest) != required_manifest_fields:
                  missing = sorted(required_manifest_fields.difference(manifest))
                  unknown = sorted(set(manifest).difference(required_manifest_fields))
                  details = []
                  if missing:
                      details.append(f"missing fields: {', '.join(missing)}")
                  if unknown:
                      details.append(f"unknown fields: {', '.join(unknown)}")
                  raise SystemExit(f"{manifest_path} has an invalid schema ({'; '.join(details)}).")
              for field, maximum_bytes in manifest_string_limits.items():
                  value = manifest[field]
                  if type(value) is not str or not value:
                      raise SystemExit(f"{manifest_path} field '{field}' must be a non-empty string.")
                  if utf8_length(value) > maximum_bytes:
                      raise SystemExit(f"{manifest_path} field '{field}' exceeds {maximum_bytes} UTF-8 bytes.")
                  if contains_control(value):
                      raise SystemExit(f"{manifest_path} field '{field}' contains a control character.")
              api_version = manifest["requires_api_version"]
              if type(api_version) is not int or api_version < 1 or api_version > 0xFFFFFFFF:
                  raise SystemExit(f"{manifest_path} field 'requires_api_version' must be an unsigned 32-bit integer of at least 1.")
              for field, (maximum_items, maximum_bytes) in manifest_array_limits.items():
                  value = manifest[field]
                  if type(value) is not list or len(value) > maximum_items:
                      raise SystemExit(f"{manifest_path} field '{field}' must be an array of at most {maximum_items} strings.")
                  if any(type(item) is not str or not item for item in value):
                      raise SystemExit(f"{manifest_path} field '{field}' must contain only non-empty strings.")
                  if any(utf8_length(item) > maximum_bytes for item in value):
                      raise SystemExit(f"{manifest_path} field '{field}' contains an item exceeding {maximum_bytes} UTF-8 bytes.")
                  if any(contains_control(item) for item in value):
                      raise SystemExit(f"{manifest_path} field '{field}' contains a control character.")
                  if len(value) != len(set(value)):
                      raise SystemExit(f"{manifest_path} field '{field}' contains duplicate strings.")
              plugin_id = manifest["id"]
              if plugin_id in discovered_ids:
                  raise SystemExit(f"Duplicate plugin id '{plugin_id}' found in {manifest_path} and {discovered_ids[plugin_id]}.")
              discovered_ids[plugin_id] = manifest_path
              parsed_manifests[manifest_path] = manifest

              entrypoint_name = manifest["entrypoint"]
              expected_extensions = {
                  "csharp": ".dll",
                  "python": ".py",
                  "tcl": ".tcl",
              }
              expected_extension = expected_extensions.get(manifest["language"])
              if expected_extension is None:
                  raise SystemExit(f"{manifest_path} declares unsupported language '{manifest['language']}'.")
              if any(separator in entrypoint_name for separator in ("/", "\\", ":")) or entrypoint_name in (".", ".."):
                  raise SystemExit(f"{manifest_path} entrypoint must be a direct child filename: {entrypoint_name}")
              if pathlib.PurePath(entrypoint_name).suffix.lower() != expected_extension:
                  raise SystemExit(
                      f"{manifest_path} entrypoint must use {expected_extension} for language '{manifest['language']}'."
                  )

              entrypoint = manifest_path.parent / entrypoint_name
              if not entrypoint.exists():
                  if manifest["language"] == "csharp":
                      csproj_files = sorted(manifest_path.parent.glob("*.csproj"))
                      if not csproj_files:
                          raise SystemExit(
                              f"{manifest_path} points at a missing C# entrypoint build output and no source project was found: {entrypoint}"
                          )
                  else:
                      raise SystemExit(f"{manifest_path} points at a missing entrypoint: {entrypoint}")

          for manifest_path in manifests:
              manifest = parsed_manifests[manifest_path]
              for dependency in manifest["dependencies"]:
                  if dependency not in discovered_ids:
                      raise SystemExit(f"{manifest_path} declares an unknown dependency '{dependency}'.")

          python_roots = [
              repo / "plugins" / "python",
              repo / "samples" / "plugins",
          ]
          for root in python_roots:
              if not root.exists():
                  continue
              for py_file in root.rglob("*.py"):
                  py_compile.compile(str(py_file), doraise=True)

          print(f"Validated {len(workflow_files)} workflow files, {len(manifests)} sample manifests, and Python syntax checks.")
          '@ | python -

          python plugins/python/test_capabilities.py
          python plugins/python/test_manifest_isolation.py
          python tools/gtk4/test_stage_runtime.py
          python tools/gtk4/test_validate_runtime_msi.py
          python tools/gtk4/test_validate_runtime_imports.py
          python tools/validate_theme_contract.py
          python tools/test_validate_theme_contract.py
        shell: powershell
